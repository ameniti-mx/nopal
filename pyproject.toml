[project]
name = "nopal-vision"
version = "0.1.0"
description = "Open-source computer vision API for physical spaces"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Ameniti"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "opencv-python-headless>=4.10,<5.0",
  "numpy>=2.0,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "pytesseract>=0.3.13,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
